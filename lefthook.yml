no_tty: true # suppress ANSI spinner/colour sequences

pre-commit:
  parallel: true
  commands:
    go-fmt:
      glob: "*.go"
      run: |
        go fmt ./...
        git add .

    go-test:
      glob: "*.go"
      run: go test ./...

    golangci-lint:
      glob: "*.go"
      run: |
        go tool golangci-lint run --fix
        git add .
